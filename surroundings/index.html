<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surroundings</title>
<meta name="description" content="See what's around an HDB unit: the view and sun from its windows, nearby roads and amenities.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/src/surroundings/surroundings.css">
</head>
<body>
<div id="app">
  <header class="top">
    <a class="btn" href="/" title="Back to your BTO money plan">← Money plan</a>
    <a class="btn" href="/studio/" title="Plan the inside of the flat">Flat Studio</a>
    <div class="brand"><span class="mark" aria-hidden="true"></span>Surroundings</div>
    <select id="site" class="btn" aria-label="Project"></select>
    <div class="spacer"></div>
    <div class="seg" role="tablist" aria-label="View">
      <button role="tab" data-v="3d" aria-selected="true" aria-controls="p3d">3D</button>
      <button role="tab" data-v="map" aria-selected="false" aria-controls="pmap">Map</button>
    </div>
  </header>
  <main id="main">
    <aside id="left" class="panel" aria-label="Pick a unit">
      <div class="sec">
        <h3>Your unit</h3>
        <label class="row"><span>Block</span><select id="block"></select></label>
        <label class="row"><span>Unit</span><select id="unit"></select></label>
        <label class="row"><span>Storey</span><input id="storey" type="number" min="2" step="1" inputmode="numeric"></label>
        <input id="storeyR" type="range" min="2" step="1" aria-label="Storey">
        <p class="note" id="unitNote"></p>
        <div class="acts"><button class="btn" id="addCmp">Add to compare</button></div>
      </div>
      <div class="sec">
        <h3>Sun</h3>
        <label class="row"><span>Day</span><select id="day"></select></label>
        <label class="row"><span>Time</span><input id="time" type="range" min="6.5" max="19.5" step="0.25" value="15"></label>
        <p class="note" id="timeLbl"></p>
      </div>
      <div class="sec">
        <h3>Reserved land around the estate</h3>
        <label class="row"><span>Assume</span><select id="future"><option value="0">left empty</option><option value="15">15 storeys</option><option value="25">25 storeys</option><option value="40" selected>40 storeys</option></select></label>
        <p class="note">The brochure marks sites for future housing but not how tall it will be. Pick a height to see how it could affect sun and view.</p>
      </div>
    </aside>
    <section id="stage">
      <div class="pane" id="p3d" role="tabpanel" aria-label="3D view">
        <canvas id="gl" aria-label="3D model of the estate. Drag to turn, scroll or pinch to zoom."></canvas>
        <div class="bar">
          <button class="chip" id="winView" aria-pressed="false">View from window</button>
          <button class="chip" id="reset">Reset view</button>
          <span class="chip north" title="Compass"><span id="compass" style="display:inline-block;transition:transform .1s"><b>N</b> ↑</span></span>
        </div>
        <div class="hint" id="hint3"></div>
      </div>
      <div class="pane" id="pmap" role="tabpanel" aria-label="Map" hidden><div id="map" role="region" aria-label="Map of the estate and amenities"></div></div>
    </section>
    <aside id="right" class="panel" aria-label="Results"><div id="results"></div></aside>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/src/surroundings/main.ts"></script>
</body>
</html>
